<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hermes Console</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b10; --bg2:#101017; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --txt:#eceaf0; --dim:#9b96a8;
  --gold:#d4a24e; --red:#c13b4e; --ok:#3ecf8e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
}
/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:var(--bg2); border-bottom:1px solid var(--line); flex:0 0 auto;
}
header img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 18%;
  border:1px solid rgba(212,162,78,.5)}
header .title{font-weight:650;font-size:15px;letter-spacing:.3px}
header .sub{font-size:11px;color:var(--ok);display:flex;align-items:center;gap:5px}
header .sub i{width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 6px var(--ok);display:inline-block}
header .spacer{flex:1}
.hbtn{
  background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer;user-select:none;
}
.hbtn:active{background:var(--card2)}
/* ---------- control strip ---------- */
.strip{
  display:flex;gap:8px;padding:8px 12px;flex:0 0 auto;overflow-x:auto;
  background:var(--bg2);border-bottom:1px solid var(--line);scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.picker{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.picker button{
  background:none;border:none;color:var(--dim);padding:7px 11px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;
}
.picker button.on{background:rgba(212,162,78,.16);color:var(--gold);font-weight:600}
.strip .label{align-self:center;font-size:11px;color:var(--dim);flex:0 0 auto;text-transform:uppercase;letter-spacing:.8px}
/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
.pane{
  position:fixed;top:0;bottom:0;width:min(84vw,340px);z-index:40;
  background:var(--bg2);border-right:1px solid var(--line);
  transform:translateX(-105%);transition:transform .22s ease;
  display:flex;flex-direction:column;
}
.pane.right{right:0;left:auto;border-right:none;border-left:1px solid var(--line);transform:translateX(105%)}
.pane.open{transform:none}
.pane h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:14px 14px 8px}
.pane .scroll{overflow-y:auto;flex:1;padding:0 10px 12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
/* history items */
.hitem{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;margin-bottom:8px;cursor:pointer;
}
.hitem:active{background:var(--card2)}
.hitem .txt{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hitem .meta{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between}
.hitem .del{color:var(--dim);padding:0 3px}
.hitem .del:active{color:var(--red)}
.pane .clear{
  margin:0 10px 12px;background:none;border:1px dashed var(--line);color:var(--dim);
  border-radius:10px;padding:8px;font-size:12px;cursor:pointer;
}
/* projects */
.proj{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:9px;cursor:pointer;
}
.proj:active{background:var(--card2)}
.proj .name{font-weight:600;font-size:14px}
.proj .hint{font-size:11.5px;color:var(--dim);margin-top:3px}
/* ---------- center ---------- */
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.chips{
  display:flex;gap:7px;padding:10px 12px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:12.5px;color:var(--txt);cursor:pointer;white-space:nowrap;
}
.chip:active{background:rgba(193,59,78,.18);border-color:rgba(193,59,78,.45)}
.feed{flex:1;overflow-y:auto;padding:4px 12px 10px}
.note{
  border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:12px;font-size:13px;color:var(--dim);margin:8px 0;
}
.note b{color:var(--txt)}
.note a{color:var(--gold);text-decoration:none}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:18px 10px}
/* ---------- input bar ---------- */
.inputbar{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:var(--bg2);border-top:1px solid var(--line);
}
.ibtn{
  width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.ibtn:active{background:var(--card2);color:var(--txt)}
.ibtn.rec{color:#fff;background:var(--red);border-color:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(193,59,78,.18)}}
textarea{
  flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--txt);font:inherit;font-size:14px;padding:9px 11px;resize:none;
  max-height:120px;outline:none;
}
textarea:focus{border-color:rgba(212,162,78,.55)}
#sendBtn{background:linear-gradient(135deg,#d4a24e,#c13b4e);color:#0b0b10;border:none;font-weight:700}
/* toast */
#toast{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(16px);
  background:#1c1c26;border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:9px 14px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;z-index:60;
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%)}
input[type=file]{display:none}
/* ---------- desktop 3-column ---------- */
@media (min-width:960px){
  .pane{position:static;transform:none;width:280px;flex:0 0 280px}
  .pane.right{flex-basis:280px}
  .overlay{display:none}
  .hbtn.only-mobile{display:none}
}
</style>
</head>
<body>

<header>
  <button class="hbtn only-mobile" id="btnHist">☰</button>
  <img src="assets/hero.jpg" alt="Лю">
  <div>
    <div class="title">Hermes · Мадам Лю</div>
    <div class="sub"><i></i>online · <span id="modelLabel">k3</span> · <span id="effortLabel">high</span></div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn only-mobile" id="btnProj">Проекты</button>
</header>

<div class="strip">
  <span class="label">Модель</span>
  <div class="picker" id="modelPicker">
    <button data-v="k3" data-label="Kimi K3">K3</button>
    <button data-v="gpt-5.6-sol" data-label="GPT-5.6">GPT-5.6</button>
  </div>
  <span class="label">Сложность</span>
  <div class="picker" id="effortPicker">
    <button data-v="low">low</button>
    <button data-v="medium">med</button>
    <button data-v="high">high</button>
    <button data-v="xhigh">xhigh</button>
  </div>
</div>

<main>
  <nav class="pane" id="histPane">
    <h3>Последние запросы</h3>
    <div class="scroll" id="histList"></div>
    <button class="clear" id="histClear">Очистить историю</button>
  </nav>

  <div class="center">
    <div class="chips" id="chips"></div>
    <div class="feed" id="feed">
      <div class="note">
        Это <b>пульт</b>: команды уходят агенту, <b>ответы приходят в чат</b> с ботом.
        Файлы и голосовые можно слать прямо в чат — агент их видит и читает.
      </div>
    </div>
    <div class="inputbar">
      <button class="ibtn" id="micBtn" title="Диктовка">🎤</button>
      <button class="ibtn" id="fileBtn" title="Файл">📎</button>
      <input type="file" id="fileInput">
      <textarea id="input" rows="1" placeholder="Приказ агенту…"></textarea>
      <button class="ibtn" id="sendBtn">➤</button>
    </div>
  </div>

  <nav class="pane right" id="projPane">
    <h3>Проекты</h3>
    <div class="scroll" id="projList"></div>
  </nav>
</main>

<div class="overlay" id="overlay"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
try { tg?.ready(); tg?.expand(); tg?.setHeaderColor('#101017'); tg?.setBackgroundColor('#0b0b10'); } catch(e){}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(html){ const el=$('toast'); el.innerHTML=html; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }
function haptic(s){ try{ tg?.HapticFeedback?.impactOccurred(s||'light'); }catch(e){} }

const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};

/* ---------- send ---------- */
function send(text, silent){
  text = (text||'').trim();
  if(!text) return;
  if(text.length > 4000){ toast('Слишком длинно для канала (>4000). Разбей или отправь файлом в чат.'); return; }
  if(tg && tg.sendData){
    tg.sendData(text);
    pushHistory(text);
    if(!silent) toast('✈️ Улетело агенту — ответ в чате');
    haptic('medium');
  } else {
    toast('Открой консоль кнопкой «✨ Мадам Лю» в боте');
  }
}

/* ---------- history ---------- */
function pushHistory(t){
  const h = store.get('hm_history', []);
  h.unshift({t, ts: Date.now()});
  store.set('hm_history', h.slice(0, 60));
  renderHistory();
}
function renderHistory(){
  const h = store.get('hm_history', []);
  const box = $('histList');
  if(!h.length){ box.innerHTML = '<div class="empty">Пока пусто — отправь первый приказ</div>'; return; }
  box.innerHTML = '';
  h.forEach((it, i) => {
    const d = document.createElement('div'); d.className='hitem';
    const dt = new Date(it.ts);
    const when = dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) + ' ' +
                 dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    d.innerHTML = '<div class="txt"></div><div class="meta"><span>'+when+'</span><span class="del">✕</span></div>';
    d.querySelector('.txt').textContent = it.t;
    d.addEventListener('click', e => {
      if(e.target.classList.contains('del')){
        const hh = store.get('hm_history', []); hh.splice(i,1); store.set('hm_history', hh);
        renderHistory(); return;
      }
      $('input').value = it.t; autosize(); $('input').focus();
      closePanes();
    });
    box.appendChild(d);
  });
}
$('histClear').addEventListener('click', () => { store.set('hm_history', []); renderHistory(); });

/* ---------- pickers ---------- */
function bindPicker(id, key, labelId, cmd){
  const p = $(id);
  const cur = store.get(key, null);
  p.querySelectorAll('button').forEach(b => {
    if(b.dataset.v === cur) b.classList.add('on');
    b.addEventListener('click', () => {
      p.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      store.set(key, b.dataset.v);
      if(labelId) $(labelId).textContent = b.dataset.label || b.dataset.v;
      send(cmd + ' ' + b.dataset.v);
    });
  });
  if(cur && labelId){
    const b = p.querySelector('button[data-v="'+cur+'"]');
    if(b) $(labelId).textContent = b.dataset.label || b.dataset.v;
  }
}
bindPicker('modelPicker','hm_model','modelLabel','/model');
bindPicker('effortPicker','hm_effort','effortLabel','/reasoning');

/* ---------- quick chips ---------- */
const CHIPS = [
  ['📊 Статус', '/status'],
  ['🌐 Пульс сайтов', 'Проверь доступность всех моих сайтов (curl, коды ответов) и доложи одним списком.'],
  ['📋 Сводка дня', 'Собери сводку: что сегодня сделано по проектам, что в работе, что горит.'],
  ['🔄 Новая сессия', '/new'],
  ['🛑 Стоп', '/stop'],
  ['🧠 Память', 'Что ты помнишь обо мне и моих проектах? Кратко, списком.'],
  ['⚡ /fast', '/fast'],
];
CHIPS.forEach(([label, cmd]) => {
  const c = document.createElement('button'); c.className='chip'; c.textContent=label;
  c.addEventListener('click', () => send(cmd));
  $('chips').appendChild(c);
});

/* ---------- projects ---------- */
const PROJECTS = [
  {name:'стрИИж.рф', hint:'Сайт БПЛА/сетки · React+Vite · :7100', cmd:'Проект «стрИИж.рф»: найди репозиторий (Documents\\ChatGPT\\стрИИж.рф или Documents\\kimi\\Workspaces\\беспилотие), покажи git status и кратко: что в работе, что дальше.'},
  {name:'МАКОШЬ', hint:'Магазин метизов :7200 + CRM :7300', cmd:'Проект МАКОШЬ (makosh-site + makosh-crm): git status обоих, что в работе, что дальше. Кратко.'},
  {name:'ПЕРВАЯ ЗВЕЗДА', hint:'Защитные сетки от БПЛА', cmd:'Проект «Первая Звезда» (сетки от БПЛА): найди репозиторий, git status, статус контента и задач. Кратко.'},
  {name:'ПЕРУН CRM', hint:'CRM Первая Звезда', cmd:'Проект ПЕРУН CRM: git status, что в работе, открытые вопросы. Кратко.'},
  {name:'продажадронов.рф', hint:'Магазин дронов · server223', cmd:'Проект продажадронов.рф: git status репозитория и статус сайта. Кратко.'},
  {name:'ПВО.МОСКВА', hint:'Сайт ПВО', cmd:'Проект ПВО.МОСКВА: git status и текущий статус. Кратко.'},
];
PROJECTS.forEach(p => {
  const d = document.createElement('div'); d.className='proj';
  d.innerHTML = '<div class="name"></div><div class="hint"></div>';
  d.querySelector('.name').textContent = p.name;
  d.querySelector('.hint').textContent = p.hint;
  d.addEventListener('click', () => { send(p.cmd); closePanes(); });
  $('projList').appendChild(d);
});

/* ---------- drawers ---------- */
function closePanes(){ $('histPane').classList.remove('open'); $('projPane').classList.remove('open'); $('overlay').classList.remove('show'); }
$('btnHist').addEventListener('click', () => { $('histPane').classList.add('open'); $('overlay').classList.add('show'); });
$('btnProj').addEventListener('click', () => { $('projPane').classList.add('open'); $('overlay').classList.add('show'); });
$('overlay').addEventListener('click', closePanes);

/* ---------- input ---------- */
const input = $('input');
function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); } });
function doSend(){ const v=input.value; if(!v.trim()){ haptic(); return; } input.value=''; autosize(); send(v); }
$('sendBtn').addEventListener('click', doSend);

/* ---------- voice: speech-to-text where supported ---------- */
let recog = null, recActive = false;
$('micBtn').addEventListener('click', () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Диктовка тут не поддержана — отправь <b>голосовое в чат</b>, агент его поймёт'); haptic(); return; }
  if(recActive){ try{ recog.stop(); }catch(e){} return; }
  recog = new SR();
  recog.lang = 'ru-RU'; recog.interimResults = true; recog.continuous = true;
  const base = input.value ? input.value + ' ' : '';
  recog.onresult = e => {
    let fin = '', inter = '';
    for(const r of e.results){ (r.isFinal ? fin += r[0].transcript : inter += r[0].transcript); }
    input.value = base + fin + inter; autosize();
  };
  recog.onend = () => { recActive=false; $('micBtn').classList.remove('rec'); };
  recog.onerror = () => { recActive=false; $('micBtn').classList.remove('rec'); toast('Микрофон недоступен — голосовое в чат сработает'); };
  try{ recog.start(); recActive=true; $('micBtn').classList.add('rec'); toast('🎤 Говорю — текст пишется в поле'); }
  catch(e){ toast('Не удалось запустить диктовку'); }
});

/* ---------- files: text goes into input, binary -> chat ---------- */
$('fileBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value='';
  if(!f) return;
  const textExt = /\.(txt|md|py|js|ts|json|ya?ml|html|css|csv|log|sh|ps1|sql|toml|ini|xml)$/i;
  if(f.size <= 12000 && (textExt.test(f.name) || f.type.startsWith('text/'))){
    const r = new FileReader();
    r.onload = () => {
      const body = String(r.result||'').slice(0, 3500);
      input.value = (input.value ? input.value+'\n' : '') + 'Файл «'+f.name+'»:\n```\n'+body+'\n```';
      autosize(); toast('📎 Текст файла добавлен в поле');
    };
    r.readAsText(f);
  } else {
    toast('«'+f.name+'» — прикрепи прямо в чат: агент видит файлы, фото и голосовые');
  }
});

renderHistory();
</script>
</body>
</html>
